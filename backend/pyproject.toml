[project]
name = "evfta-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.104",
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "pgvector>=0.5.0",
    "procrastinate>=3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "reportlab>=5.0.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép chữ tiếng Việt trong chuỗi/comment

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "E501"]  # dữ liệu synthetic trong test có thể dài
"app/modules/copilot/prompt.py" = ["E501"]  # văn bản prompt

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "reportlab.*", "asyncpg.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app"]
markers = ["slow: đo hiệu năng với dữ liệu lớn (vẫn chạy mặc định)"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
