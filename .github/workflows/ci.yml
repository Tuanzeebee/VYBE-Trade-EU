name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evfta
          POSTGRES_PASSWORD: evfta
          POSTGRES_DB: evfta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evfta" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://evfta:evfta@localhost:5432/evfta
      TEST_DATABASE_URL: postgresql+asyncpg://evfta:evfta@localhost:5432/evfta_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
